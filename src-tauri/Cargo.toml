[package]
name = "gittrunk"
version = "0.1.0"
description = "A fast, native Git client"
authors = ["gittrunk contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"
default-run = "gittrunk"

[lib]
name = "gittrunk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2"
# Network operations go through the git CLI, so libgit2 is built without
# its HTTPS/SSH transports (avoids OpenSSL on Windows).
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
notify = "8"
parking_lot = "0.12.5"
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls-no-provider", "stream", "system-proxy", "http2"] }
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
mockito = "1.7.2"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
