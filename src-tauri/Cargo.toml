[package]
name = "gittrunk"
version = "0.2.0"
description = "A fast, native Git client"
authors = ["gittrunk contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"
default-run = "gittrunk"

[lib]
name = "gittrunk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Dev tool, not an app binary: an example so installers never bundle it.
[[example]]
name = "export-bindings"
path = "examples/export_bindings.rs"

[features]
default = []
# Host-testable stand-in for the Android backend: libgit2 for all git work,
# file-backed secret store. Never enabled in desktop releases.
embedded-git = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2"
# Network operations go through the git CLI, so libgit2 is built without
# its HTTPS/SSH transports (avoids OpenSSL on Windows). The Android target
# table below adds them back (Cargo unifies features per target).
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
notify = "8"
parking_lot = "0.12.5"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls-no-provider", "stream", "system-proxy", "http2"] }
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

webpki-roots = "1"
sha2 = "0.10"
base64 = "0.22"
time = { version = "0.3", default-features = false, features = ["std", "parsing"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
portable-pty = "0.9"
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "encryption", "getrandom"] }

[target.'cfg(target_os = "android")'.dependencies]
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "https", "vendored-openssl"] }
# libgit2 cannot read cert files on Android (OpenSSL is built no-stdio): certs are
# parsed from memory and handed to libgit2 through its raw option API.
libgit2-sys = "0.18"
openssl = "0.10"
foreign-types = "0.3"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
mockito = "1.7.2"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
