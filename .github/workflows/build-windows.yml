# Builds the Windows app and installers and uploads them as workflow artifacts.
# Runs on every push to main and to development branches, on PRs into main,
# and on demand. Releases are handled by release.yml.
name: Build Windows

on:
  push:
    branches: [main, develop, "claude/**", "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable pnpm via Corepack
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          pnpm --version
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Tauri downloads NSIS and WiX on demand; WebView2 is preinstalled on
      # GitHub Windows runners and bootstrapped by the installer on user machines.
      - name: Build app and installers
        run: pnpm tauri build --bundles nsis,msi

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/gittrunk.exe out/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: gittrunk-windows-${{ github.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
