name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Windows and macOS file systems are case-insensitive: two modules whose
      # names differ only in case (e.g. miniGraph.ts / MiniGraph.tsx) resolve to
      # the same file there and break the build.
      - name: No case-colliding module paths
        if: runner.os == 'Linux'
        run: |
          dupes=$(git ls-files | tr 'A-Z' 'a-z' | sed -E 's/\.(tsx?|jsx?|mjs|cjs)$//' | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "::error::Paths differ only in case: $dupes"; exit 1; fi

      - name: Frontend lint
        run: pnpm lint
      - name: Frontend format
        run: pnpm format:check
      - name: Frontend typecheck
        run: pnpm typecheck
      - name: Frontend tests
        run: pnpm test

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
      # Git for Windows enables core.autocrlf; exercise that on the fast runner too.
      - name: cargo test (global core.autocrlf=true)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        # ~/.gitconfig (not GIT_CONFIG_GLOBAL) so libgit2 sees it too; runners are ephemeral.
        run: |
          git config --global core.autocrlf true
          cargo test

      - name: IPC bindings are up to date
        if: runner.os == 'Linux'
        run: |
          pnpm bindings
          git diff --exit-code -- src/ipc/bindings.ts || {
            echo "::error::src/ipc/bindings.ts is stale. Run 'pnpm bindings' and commit the result."
            exit 1
          }

  e2e:
    name: E2E tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev \
            webkit2gtk-driver xvfb

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com

      - name: Install tauri-driver
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-driver

      - run: pnpm install --frozen-lockfile

      - name: Build app for e2e
        run: pnpm tauri build --debug --no-bundle

      - name: Run e2e tests
        run: xvfb-run -a -s "-screen 0 1400x900x24" pnpm e2e

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ github.sha }}
          path: e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 7
